# Installed to ~/.config/systemd/user/voxtype.service.d/mode.conf
#
# Redirects the daemon to the launcher that picks the binary and config for the
# active mode. The empty ExecStart= clears the value from the packaged unit —
# without it systemd would append a second command instead of replacing it.
#
# Living in a .d/ drop-in means package updates that rewrite voxtype.service
# do not wipe this.
[Service]
ExecStart=
ExecStart=%h/.local/bin/voxtype-daemon-launch
